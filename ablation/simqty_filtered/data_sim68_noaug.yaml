# Sim-quantity ablation: sim68 (2x), NO real augmentation

image_size: 224

dataset: sim+real

synthetic:
  num_samples: 256
  num_objects: 8

sim:
  root: /media/hdd2/ihsuan/gs_blender/renders_v3
  mesh_dir: /media/hdd2/ihsuan/gs_blender/meshes
  rgb_subdir: rgb
  use_gt_depth: true
  use_rendered_normals: true
  gel_view_m: 0.017502
  rot_augment: true
  rot_augment_max_deg: 180.0
  val_every: 20
  train_samples_per_session: 68

real:
  root: /media/hdd2/ihsuan/gs_blender/real_filtered
  mesh_dir: /media/hdd2/ihsuan/gs_blender/meshes
  rgb_subdir: rgb
  use_rendered_normals: false
  val_every: 10
  augment: false
  oversample: 1

loader:
  num_workers: 8
  pin_memory: true
  prefetch_factor: 4
  persistent_workers: true

norm:
  imagenet_mean: [123.675, 116.28, 103.53]
  imagenet_std:  [58.395, 57.12, 57.375]
